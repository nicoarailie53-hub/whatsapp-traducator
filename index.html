<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Internațional & Traducător RO ↔ FR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; max-width: 760px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 14px 18px; border-radius: 14px; margin-bottom: 16px; border: 1px solid #334155; }
    .top h1 { font-size: 1.15rem; color: #25D366; }
    .top a { color: #fbbf24; text-decoration: none; font-weight: 700; font-size: 0.95rem; }
    .card { background: #1e293b; padding: 16px; border-radius: 14px; border: 1px solid #334155; margin-bottom: 16px; }
    select, textarea, input { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 10px; padding: 12px; font-size: 1rem; margin-bottom: 12px; }
    textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
    .row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    button { flex: 1; padding: 13px 16px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; color: #fff; min-width: 120px; }
    .btn-mic { background: #f97316; }
    .btn-tr { background: #0ea5e9; }
    .btn-del { background: #475569; flex: 0.5; min-width: 80px; }
    .btn-spk { background: #334155; border: 1px solid #475569; }
    .btn-cpy { background: #334155; border: 1px solid #475569; }
    .btn-wa { background: #25D366; color: #052e16; font-size: 1.08rem; }
    .status { font-size: 0.9rem; color: #94a3b8; margin-top: 6px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>🌍 WhatsApp Internațional & Traducător</h1>
      <div style="font-size:0.85rem;color:#94a3b8;">Traducere vocală & scrisă RO ↔ FR</div>
    </div>
    <a href="https://github.io">← Hub</a>
  </div>

  <div class="card">
    <label for="dir">Direcția de traducere:</label>
    <select id="dir">
      <option value="fr|ro">🇫🇷 Franceză ➔ 🇷🇴 Română</option>
      <option value="ro|fr">🇷🇴 Română ➔ 🇫🇷 Franceză</option>
    </select>

    <textarea id="src" placeholder="Scrie sau dictează mesajul aici..."></textarea>

    <div class="row">
      <button class="btn-mic" id="btnMic">🎙️ Vorbește</button>
      <button class="btn-tr" id="btnTr">🔄 Tradu acum</button>
      <button class="btn-del" id="btnDel">🗑️ Șterge</button>
    </div>

    <textarea id="dst" placeholder="Traducerea apare aici..."></textarea>

    <label for="voiceSelect">Vocea pentru citire (alege vocea feminină preferată):</label>
    <select id="voiceSelect"></select>

    <div class="row">
      <button class="btn-spk" id="btnSpk">🔊 Ascultă traducerea</button>
      <button class="btn-cpy" id="btnCpy">📋 Copiază</button>
    </div>
    <div class="status" id="status">Pregătit.</div>
  </div>

  <div class="card">
    <label>📲 Trimite direct pe WhatsApp (număr internațional):</label>
    <div class="row">
      <select id="prefix" style="flex:0.45;">
        <option value="33">🇫🇷 Franța (+33)</option>
        <option value="40">🇷🇴 România (+40)</option>
        <option value="32">🇧🇪 Belgia (+32)</option>
        <option value="41">🇨🇭 Elveția (+41)</option>
        <option value="49">🇩🇪 Germania (+49)</option>
        <option value="39">🇮🇹 Italia (+39)</option>
        <option value="34">🇪🇸 Spania (+34)</option>
        <option value="44">🇬🇧 UK (+44)</option>
      </select>
      <input id="phone" type="tel" placeholder="Număr (ex: 06 12 34 56 78)" style="flex:0.55;" />
    </div>
    <button class="btn-wa" id="btnWa">💬 Deschide WhatsApp și trimite mesajul</button>
  </div>

  <script>
    const srcEl = document.getElementById("src");
    const dstEl = document.getElementById("dst");
    const dirEl = document.getElementById("dir");
    const statusEl = document.getElementById("status");
    const voiceSelect = document.getElementById("voiceSelect");

    function populateVoices() {
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const [, to] = dirEl.value.split("|");
      const savedName = localStorage.getItem("favVoice_" + to) || "";
      voiceSelect.innerHTML = "";

      const matching = voices.filter(v => v.lang.toLowerCase().startsWith(to));
      const others = voices.filter(v => !v.lang.toLowerCase().startsWith(to));
      const ordered = [...matching, ...others];

      ordered.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = v.name + " (" + v.lang + ")";
        voiceSelect.appendChild(opt);
      });

      if (savedName && ordered.some(v => v.name === savedName)) {
        voiceSelect.value = savedName;
      } else {
        const fem = matching.find(v => !/andrei|paul|henri|claude|remy|alain|male/i.test(v.name)) || matching[0];
        if (fem) voiceSelect.value = fem.name;
      }
    }

    if ("speechSynthesis" in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }
    dirEl.addEventListener("change", populateVoices);
    voiceSelect.addEventListener("change", () => {
      const [, to] = dirEl.value.split("|");
      localStorage.setItem("favVoice_" + to, voiceSelect.value);
    });

    async function translateText() {
      const q = srcEl.value.trim();
      if (!q) return;
      const [from, to] = dirEl.value.split("|");
      statusEl.textContent = "Se traduce (" + from.toUpperCase() + " ➔ " + to.toUpperCase() + ")...";
      let translated = "";

      try {
        const gUrl = "https://" + "translate.googleapis." + "com/translate_a/single?client=gtx&sl=" + from + "&tl=" + to + "&dt=t&q=" + encodeURIComponent(q);
        const res = await fetch(gUrl);
        const data = await res.json();
        if (data && data[0]) translated = data[0].map(x => x[0]).join("");
      } catch (e) {}

      if (!translated) {
        try {
          const mUrl = "https://" + "api.mymemory." + "translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + from + "|" + to;
          const res2 = await fetch(mUrl);
          const data2 = await res2.json();
          translated = data2?.responseData?.translatedText || "";
        } catch (e2) {}
      }

      if (translated) {
        dstEl.value = translated;
        statusEl.textContent = "✅ Tradus (" + from.toUpperCase() + " ➔ " + to.toUpperCase() + ").";
      } else {
        statusEl.textContent = "❌ Eroare internet la traducere.";
      }
    }

    document.getElementById("btnTr").addEventListener("click", translateText);
    document.getElementById("btnDel").addEventListener("click", () => { srcEl.value = ""; dstEl.value = ""; statusEl.textContent = "Șters."; });

    document.getElementById("btnSpk").addEventListener("click", () => {
      const txt = (dstEl.value || srcEl.value).trim();
      if (!txt || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      const voices = window.speechSynthesis.getVoices();
      const chosen = voices.find(v => v.name === voiceSelect.value);
      const [, to] = dirEl.value.split("|");

      const parts = txt.match(/[^.!?]+[.!?]*/g) || [txt];
      parts.forEach(p => {
        const chunk = p.trim();
        if (!chunk) return;
        const u = new SpeechSynthesisUtterance(chunk);
        if (chosen) { u.voice = chosen; u.lang = chosen.lang; }
        else { u.lang = to === "fr" ? "fr-FR" : "ro-RO"; }
        window.speechSynthesis.speak(u);
      });
      statusEl.textContent = "🔊 Citește cu: " + (chosen ? chosen.name : to.toUpperCase());
    });

    document.getElementById("btnCpy").addEventListener("click", () => {
      const txt = dstEl.value || srcEl.value;
      if (txt) { navigator.clipboard.writeText(txt); statusEl.textContent = "📋 Copiat!"; }
    });

    document.getElementById("btnMic").addEventListener("click", () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { statusEl.textContent = "Microfon nesuportat în acest browser."; return; }
      const [from] = dirEl.value.split("|");
      const rec = new SR();
      rec.lang = from === "fr" ? "fr-FR" : "ro-RO";
      statusEl.textContent = "🎙️ Vorbește acum (" + rec.lang + ")...";
      rec.onresult = (e) => { srcEl.value = e.results[0][0].transcript; translateText(); };
      rec.onerror = () => { statusEl.textContent = "Nu s-a auzit nimic, încearcă din nou."; };
      rec.start();
    });

    document.getElementById("btnWa").addEventListener("click", () => {
      const prefix = document.getElementById("prefix").value;
      let num = document.getElementById("phone").value.replace(/\D/g, "");
      if (num.startsWith("0")) num = num.slice(1);
      if (!num) { statusEl.textContent = "Introdu un număr de telefon!"; return; }
      const msg = encodeURIComponent((dstEl.value || srcEl.value || "").trim());
      const waUrl = "https://" + "wa.me/" + prefix + num + (msg ? "?text=" + msg : "");
      window.open(waUrl, "_blank");
    });
  </script>
</body>
</html>
